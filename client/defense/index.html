<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Defense Matrix</title>
    <style>
        body { background: #1a0000; color: #ff3e3e; font-family: sans-serif; padding: 2rem; }
        .shield-status { border: 5px solid #ff3e3e; padding: 2rem; border-radius: 50%; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; margin: 0 auto; text-align: center; }
        .alert { background: #ff3e3e; color: white; padding: 0.5rem; margin-top: 2rem; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="shield-status">
        <h2>DEFENSE_SHIELD<br>CALIBRATED</h2>
    </div>
    <div class="alert">NO_INTERFERENCE_DETECTED // SYSTEM_HARDENED</div>
</body>
</html>
