steps:
  # 1. Build the Qwen Sovereign Core Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sovereign-qwen-core:latest', '-f', './api/models/qwen-server/Dockerfile', '.']

  # 2. Build the Unified Hub Server Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/sovereign-hub-server:latest', '.']

  # 3. Push images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sovereign-qwen-core:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sovereign-hub-server:latest']

  # 4. Deploy to Cloud Run (for the Hub/Dashboard)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sovereign-hub'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sovereign-api-server:latest'
      - '--region'
      - 'northamerica-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/sovereign-ai-core:latest'
  - 'gcr.io/$PROJECT_ID/sovereign-api-server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
